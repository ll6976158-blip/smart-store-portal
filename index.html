
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Store Management Portal</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            text-align: center;
        }

        header {
            background: #253858;
            color: white;
            padding: 25px;
        }

        h1 {
            margin: 0;
        }

        .login-section {
            margin: 25px auto;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin: 40px 20px;
        }

        .box {
            background: white;
            padding: 25px;
            width: 280px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        button {
            background: #007bff;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }

        button:hover {
            background: #0056b3;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        #loginStatus {
            font-weight: bold;
        }

        footer {
            margin: 40px 0 20px;
            color: #666;
        }
    </style>
</head>

<body>

    <header>
        <h1>Smart Store Management Portal</h1>
        <p>Cloud-Based Smart Retail Management System</p>
    </header>

    <div class="login-section">
        <button id="loginButton" onclick="login()">
            Sign In with Cognito
        </button>
        <p id="loginStatus">Not signed in</p>
    </div>

    <div class="container">

        <div class="box">
            <h2>Store Status</h2>
            <p id="status">Status: --</p>
            <button onclick="checkStatus()">
                Check Status
            </button>
        </div>

        <div class="box">
            <h2>Temperature Monitoring</h2>
            <p id="temp">Temperature: --</p>
            <button onclick="checkTemperature()">
                Check Temperature
            </button>
        </div>

        <div class="box">
            <h2>Inventory Monitoring</h2>
            <p id="stock">Available Stock: --</p>
            <button onclick="checkStock()">
                Check Inventory
            </button>
        </div>

    </div>

    <footer>
        <p>Smart Store Initiative | AWS Cloud Project</p>
    </footer>

    <script>
        const clientId = "7a6fn2trd3fo3dvggnb7mgufig";

        const cognitoDomain =
            "https://us-east-1vpcl5cfol.auth.us-east-1.amazoncognito.com";

        const redirectUri =
            "https://ll6976158-blip.github.io/smart-store-portal/";

        function base64url(bytes) {
            return btoa(
                String.fromCharCode(...bytes)
            )
            .replace(/\+/g, "-")
            .replace(/\//g, "_")
            .replace(/=+$/, "");
        }

        async function login() {
            try {
                const verifierBytes = new Uint8Array(32);
                crypto.getRandomValues(verifierBytes);

                const verifier = base64url(verifierBytes);

                const digest = await crypto.subtle.digest(
                    "SHA-256",
                    new TextEncoder().encode(verifier)
                );

                const challenge = base64url(
                    new Uint8Array(digest)
                );

                const stateBytes = new Uint8Array(16);
                crypto.getRandomValues(stateBytes);

                const state = base64url(stateBytes);

                sessionStorage.setItem(
                    "pkce_verifier",
                    verifier
                );

                sessionStorage.setItem(
                    "oauth_state",
                    state
                );

                const params = new URLSearchParams({
                    response_type: "code",
                    client_id: clientId,
                    redirect_uri: redirectUri,
                    scope: "openid email",
                    code_challenge_method: "S256",
                    code_challenge: challenge,
                    state: state
                });

                window.location.href =
                    cognitoDomain +
                    "/oauth2/authorize?" +
                    params.toString();

            } catch (error) {
                document.getElementById(
                    "loginStatus"
                ).textContent = "Unable to start login";
                console.error(error);
            }
        }

        function checkStatus() {
            document.getElementById("status").textContent =
                "Store is Active (Demo Status)";
        }

       
async function checkTemperature() {
    const tempDisplay = document.getElementById("temp");

    const token = window.smartStoreAccessToken;

    if (!token) {
        tempDisplay.textContent =
            "Please sign in with Cognito first.";
        return;
    }

    tempDisplay.textContent = "Loading temperature...";

    const apiUrl =
        "https://bjqm62d6d7.execute-api.us-east-1.amazonaws.com/sensor";

    try {
        const response = await fetch(apiUrl, {
            method: "GET",
            headers: {
                "Authorization": "Bearer " + token
            }
        });

        if (!response.ok) {
            throw new Error(
                "API request failed: " + response.status
            );
        }

        const result = await response.json();

        // Some Lambda integrations return the data
        // directly; others wrap it in a body field.
        let data = result;

        if (result.body !== undefined) {
            data = typeof result.body === "string"
                ? JSON.parse(result.body)
                : result.body;
        }

        if (data.temperature !== undefined) {
            tempDisplay.textContent =
                "Temperature: " + data.temperature + " °C";
        } else {
            tempDisplay.textContent =
                "No temperature value found.";
            console.log("API response:", data);
        }

    } catch (error) {
        tempDisplay.textContent =
            "Unable to load temperature.";
        console.error("Smart Store API error:", error);
    }
}


        function checkStock() {
            document.getElementById("stock").textContent =
                "Available Stock: 150 Items (Demo Data)";
        }

        const query = new URLSearchParams(
            window.location.search
        );

        if (query.has("error")) {
            document.getElementById(
                "loginStatus"
            ).textContent =
                "Login error: " + query.get("error");

            history.replaceState(
                {},
                document.title,
                window.location.pathname
            );

        } else if (query.has("code")) {
            document.getElementById(
                "loginStatus"
            ).textContent =
                "Login returned a code. Token exchange pending.";

            // The next step will securely exchange this
            // authorization code using PKCE.
            // Do not treat the code as an access token.
        }
    </script>

</body>
</html>
