
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Store Management Portal</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f4f6f9;
            font-family: Arial, sans-serif;
            text-align: center;
            color: #253858;
        }

        header {
            background: #253858;
            color: white;
            padding: 28px 15px;
        }

        header h1 {
            margin: 0 0 10px;
        }

        header p {
            margin: 0;
        }

        .login-section {
            padding: 25px 15px 5px;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 12px 20px;
            margin: 5px;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        #logoutButton {
            background: #dc3545;
            display: none;
        }

        #loginStatus {
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin: 35px 15px;
        }

        .box {
            width: 290px;
            min-height: 190px;
            padding: 25px 18px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .box h2 {
            font-size: 21px;
        }

        .box p {
            min-height: 38px;
        }

        footer {
            color: #666;
            padding: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Smart Store Management Portal</h1>
        <p>Cloud-Based Smart Retail Management System</p>
    </header>

    <div class="login-section">
        <button id="loginButton" onclick="login()">
            Sign In with Cognito
        </button>

        <button id="logoutButton" onclick="logout()">
            Sign Out
        </button>

        <p id="loginStatus">Not signed in</p>
    </div>

    <div class="container">

        <div class="box">
            <h2>Store Status</h2>
            <p id="status">Status: --</p>

            <button onclick="checkStatus()">
                Check Status
            </button>
        </div>

        <div class="box">
            <h2>Temperature Monitoring</h2>
            <p id="temp">Temperature: --</p>

            <button onclick="checkTemperature()">
                Check Temperature
            </button>
        </div>

        <div class="box">
            <h2>Inventory Monitoring</h2>
            <p id="stock">Available Stock: --</p>

            <button onclick="checkStock()">
                Check Inventory
            </button>
        </div>

    </div>

    <footer>
        Smart Store Initiative | AWS Cloud Project
    </footer>

    <script>
        // ------------------------------------
        // AWS COGNITO CONFIGURATION
        // ------------------------------------

        const clientId =
            "7a6fn2trd3fo3dvggnb7mgufig";

        const cognitoDomain =
            "https://us-east-1vpcl5cfol.auth.us-east-1.amazoncognito.com";

        const redirectUri =
            "https://ll6976158-blip.github.io/smart-store-portal/";

        // ------------------------------------
        // API GATEWAY CONFIGURATION
        // ------------------------------------

        const apiUrl =
            "https://bjqm62d6d7.execute-api.us-east-1.amazonaws.com/sensor";

        // Access token kept in page memory
        let accessToken = null;
        let tokenExpiry = 0;

        // ------------------------------------
        // HELPER FUNCTIONS
        // ------------------------------------

        function base64url(bytes) {
            return btoa(
                String.fromCharCode(...bytes)
            )
            .replace(/\+/g, "-")
            .replace(/\//g, "_")
            .replace(/=+$/, "");
        }

        function showLoginStatus(message) {
            document.getElementById(
                "loginStatus"
            ).textContent = message;
        }

        function updateLoginButtons(signedIn) {
            document.getElementById(
                "loginButton"
            ).style.display =
                signedIn ? "none" : "inline-block";

            document.getElementById(
                "logoutButton"
            ).style.display =
                signedIn ? "inline-block" : "none";
        }

        // ------------------------------------
        // COGNITO LOGIN WITH PKCE
        // ------------------------------------

        async function login() {
            try {
                showLoginStatus("Opening Cognito login...");

                const verifierBytes =
                    new Uint8Array(32);

                crypto.getRandomValues(
                    verifierBytes
                );

                const verifier =
                    base64url(verifierBytes);

                const digest =
                    await crypto.subtle.digest(
                        "SHA-256",
                        new TextEncoder().encode(verifier)
                    );

                const challenge =
                    base64url(new Uint8Array(digest));

                const stateBytes =
                    new Uint8Array(16);

                crypto.getRandomValues(stateBytes);

                const state = base64url(stateBytes);

                sessionStorage.setItem(
                    "pkce_verifier",
                    verifier
                );

                sessionStorage.setItem(
                    "oauth_state",
                    state
                );

                const params = new URLSearchParams({
                    response_type: "code",
                    client_id: clientId,
                    redirect_uri: redirectUri,
                    scope: "openid email",
                    code_challenge_method: "S256",
                    code_challenge: challenge,
                    state: state
                });

                window.location.assign(
                    cognitoDomain +
                    "/oauth2/authorize?" +
                    params.toString()
                );

            } catch (error) {
                console.error("Login error:", error);

                showLoginStatus(
                    "Unable to open Cognito login."
                );
            }
        }

        // ------------------------------------
        // EXCHANGE AUTHORIZATION CODE
        // ------------------------------------

        async function handleCognitoCallback() {
            const query =
                new URLSearchParams(window.location.search);

            if (query.has("error")) {
                const errorDescription =
                    query.get("error_description") ||
                    query.get("error");

                showLoginStatus(
                    "Cognito error: " + errorDescription
                );

                history.replaceState(
                    {},
                    document.title,
                    window.location.pathname
                );

                return;
            }

            if (!query.has("code")) {
                return;
            }

            const code = query.get("code");
            const returnedState = query.get("state");

            const savedState =
                sessionStorage.getItem("oauth_state");

            const verifier =
                sessionStorage.getItem("pkce_verifier");

            // Remove authorization code from URL
            history.replaceState(
                {},
                document.title,
                window.location.pathname
            );

            if (
                !verifier ||
                !savedState ||
                returnedState !== savedState
            ) {
                showLoginStatus(
                    "Login verification failed. Sign in again."
                );
                return;
            }

            sessionStorage.removeItem("oauth_state");
            sessionStorage.removeItem("pkce_verifier");

            showLoginStatus(
                "Completing secure sign-in..."
            );

            try {
                const body = new URLSearchParams({
                    grant_type: "authorization_code",
                    client_id: clientId,
                    code: code,
                    redirect_uri: redirectUri,
                    code_verifier: verifier
                });

                const response = await fetch(
                    cognitoDomain + "/oauth2/token",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type":
                                "application/x-www-form-urlencoded"
                        },
                        body: body.toString()
                    }
                );

                if (!response.ok) {
                    const details = await response.text();

                    console.error(
                        "Token endpoint response:",
                        response.status,
                        details
                    );

                    throw new Error(
                        "Token exchange HTTP " +
                        response.status
                    );
                }

                const tokens = await response.json();

                if (!tokens.access_token) {
                    throw new Error(
                        "Access token missing from response"
                    );
                }

                accessToken = tokens.access_token;

                tokenExpiry =
                    Date.now() +
                    (tokens.expires_in || 3600) * 1000;

                updateLoginButtons(true);

                showLoginStatus(
                    "Signed in successfully!"
                );

            } catch (error) {
                console.error(
                    "Token exchange error:",
                    error
                );

                accessToken = null;
                tokenExpiry = 0;

                updateLoginButtons(false);

                showLoginStatus(
                    "Token exchange failed. Please sign in again."
                );
            }
        }

        // ------------------------------------
        // LOGOUT
        // ------------------------------------

        function logout() {
            accessToken = null;
            tokenExpiry = 0;

            sessionStorage.removeItem("oauth_state");
            sessionStorage.removeItem("pkce_verifier");

            updateLoginButtons(false);
            showLoginStatus("Signing out...");

            const params = new URLSearchParams({
                client_id: clientId,
                logout_uri: redirectUri
            });

            window.location.assign(
                cognitoDomain +
                "/logout?" +
                params.toString()
            );
        }

        // ------------------------------------
        // STORE STATUS
        // ------------------------------------

        function checkStatus() {
            document.getElementById(
                "status"
            ).textContent =
                "Store is Active (Demo Status)";
        }

        // ------------------------------------
        // TEMPERATURE FROM AWS API
        // ------------------------------------

        async function checkTemperature() {
            const display =
                document.getElementById("temp");

            if (
                !accessToken ||
                Date.now() >= tokenExpiry
            ) {
                display.textContent =
                    "Please sign in with Cognito first.";

                return;
            }

            display.textContent =
                "Loading temperature...";

            try {
                const response = await fetch(apiUrl, {
                    method: "GET",
                    headers: {
                        "Authorization":
                            "Bearer " + accessToken
                    }
                });

                if (response.status === 401 ||
                    response.status === 403) {
                    display.textContent =
                        "Access denied. Check API authorization.";
                    return;
                }

                if (!response.ok) {
                    throw new Error(
                        "API HTTP " + response.status
                    );
                }

                const result = await response.json();

                let data = result;

                if (
                    result &&
                    result.body !== undefined
                ) {
                    data =
                        typeof result.body === "string"
                        ? JSON.parse(result.body)
                        : result.body;
                }

                if (
                    data &&
                    data.temperature !== undefined
                ) {
                    display.textContent =
                        "Temperature: " +
                        data.temperature +
                        " °C";
                } else {
                    display.textContent =
                        "Temperature field not found.";

                    console.log(
                        "Actual API response:",
                        data
                    );
                }

            } catch (error) {
                console.error(
                    "Temperature API error:",
                    error
                );

                display.textContent =
                    "Unable to load temperature. Check console.";
            }
        }

        // ------------------------------------
        // INVENTORY
        // ------------------------------------

        function checkStock() {
            document.getElementById(
                "stock"
            ).textContent =
                "Available Stock: 150 Items (Demo Data)";
        }

        // ------------------------------------
        // START APPLICATION
        // ------------------------------------

        updateLoginButtons(false);
        handleCognitoCallback();

    </script>

</body>
</html>
