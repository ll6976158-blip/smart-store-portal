<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Store Management Portal</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            text-align: center;
        }

        header {
            background-color: #253858;
            color: white;
            padding: 25px;
        }

        h1 {
            margin: 0;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin: 40px 20px;
        }

        .box {
            background-color: white;
            padding: 25px;
            width: 280px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        button {
            background-color: #007bff;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        footer {
            margin-top: 40px;
            color: #666;
        }
    </style>
</head>

<body>

    <header>
        <h1>Smart Store Management Portal</h1>
        <p>Cloud-Based Smart Retail Management System</p>
    </header>

<div style="text-align:center; margin:20px;">
    <button onclick="login()">Sign In with Cognito</button>
    <p id="loginStatus">Not signed in</p>
</div>

    <div class="container">

        <div class="box">
            <h2>Store Status</h2>
            <p id="status">Status: --</p>
            <button onclick="checkStatus()">Check Status</button>
        </div>

        <div class="box">
            <h2>Temperature Monitoring</h2>
            <p id="temp">Temperature: --</p>
            <button onclick="checkTemperature()">Check Temperature</button>
        </div>

        <div class="box">
            <h2>Inventory Monitoring</h2>
            <p id="stock">Available Stock: --</p>
            <button onclick="checkStock()">Check Inventory</button>
        </div>

    </div>

    <footer>
        <p>Smart Store Initiative | AWS Cloud Project</p>
    </footer>

    <script>

        
async function login() {
    const clientId = "7a6fn2trd3fo3dvggnb7mgufig";
    const domain =
        "https://us-east-1vpcl5cfol.auth.us-east-1.amazoncognito.com";
    const redirectUri =
        "https://ll6976158-blip.github.io/smart-store-portal/";

    const bytes = new Uint8Array(32);
    crypto.getRandomValues(bytes);

    const verifier = Array.from(bytes, b =>
        b.toString(16).padStart(2, "0")
    ).join("");

    const digest = await crypto.subtle.digest(
        "SHA-256",
        new TextEncoder().encode(verifier)
    );

    const challenge = btoa(
        String.fromCharCode(...new Uint8Array(digest))
    ).replace(/\+/g, "-")
     .replace(/\//g, "_")
     .replace(/=+$/, "");

    const stateBytes = new Uint8Array(16);
    crypto.getRandomValues(stateBytes);
    const state = Array.from(stateBytes, b =>
        b.toString(16).padStart(2, "0")
    ).join("");

    sessionStorage.setItem("pkce_verifier", verifier);
    sessionStorage.setItem("oauth_state", state);

    const params = new URLSearchParams({
        response_type: "code",
        client_id: clientId,
        redirect_uri: redirectUri,
        scope: "openid email",
        code_challenge_method: "S256",
        code_challenge: challenge,
        state: state
    });

    window.location.href =
        domain + "/oauth2/authorize?" + params.toString();
}

        function checkStatus() {
            document.getElementById("status").textContent =
                "Store is Active (Demo Status)";
        }

        async function checkTemperature() {
            document.getElementById("temp").textContent =
                "Loading temperature...";

            try {
                const response = await fetch("/sensor");

                if (!response.ok) {
                    throw new Error("Sensor request failed");
                }

                const data = await response.json();

                document.getElementById("temp").textContent =
                    "Temperature: " + data.temperature + "°C";

            } catch (error) {
                document.getElementById("temp").textContent =
                    "Unable to load temperature";
            }
        }

        function checkStock() {
            document.getElementById("stock").textContent =
                "Available Stock: 150 Items (Demo Data)";
        }

    </script>

</body>
</html>
